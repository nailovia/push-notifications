<!DOCTYPE html>
<html lang="en">
<head>
    <title>Processing...</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        p { color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <p>Please click <b>"Allow"</b> above to receive updates...</p>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-messaging.js";

        // Apni Firebase Config yahan paste karein
        const firebaseConfig = {
          apiKey: "YOUR_API_KEY",
          projectId: "YOUR_PROJECT_ID",
          messagingSenderId: "YOUR_SENDER_ID",
          appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        // Page load hote hi automatically native prompt le aao
        window.onload = function() {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    // VAPID key yahan dalein
                    getToken(messaging, { vapidKey: 'YOUR_VAPID_KEY_HERE' }).then((currentToken) => {
                        if (currentToken) {
                            console.log("Token saved");
                            window.close(); // Allow karte hi popup khud band ho jayega
                        }
                    });
                } else {
                    window.close(); // Block karne par bhi khud band ho jayega
                }
            });
        };
    </script>
</body>
</html>
